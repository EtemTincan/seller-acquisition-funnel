[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
font = "Instrument Sans, sans-serif"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/InstrumentSans.ttf"
weight = "400 700"

# The page follows the visitor's light or dark system setting.
[theme.light]
primaryColor = "#1F6F8B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F6"
textColor = "#1B2A32"

[theme.dark]
primaryColor = "#5AAEC9"
backgroundColor = "#10171A"
secondaryBackgroundColor = "#1A2327"
textColor = "#E4EBEE"
